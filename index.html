<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

      <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f3ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saara Live AI</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --cyber-pink: #ff007f;
            --cyber-cyan: #00f3ff;
            --cyber-purple: #8a2be2;
            --bg-void: #030014;
            --glass-card: rgba(13, 10, 31, 0.85);
            --glass-border: rgba(0, 243, 255, 0.2);
            --user-gradient: linear-gradient(135deg, #7928ca, #ff0080);
            --bot-bg: rgba(18, 14, 41, 0.85);
            --text-main: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            z-index: 0;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--cyber-pink); top: -40px; left: -40px; }
        .orb-2 { width: 350px; height: 350px; background: var(--cyber-purple); bottom: -60px; right: -60px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(25px) scale(1.05); }
        }

        .chat-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            height: 94vh;
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15);
            overflow: hidden;
        }

        /* Chat History Sidebar Panel Styles */
        .history-sidebar {
            position: absolute;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: rgba(5, 3, 22, 0.96);
            backdrop-filter: blur(25px);
            border-right: 1px solid var(--glass-border);
            z-index: 120;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
        }

        .history-sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--cyber-cyan);
            letter-spacing: 0.5px;
        }

        .new-chat-btn {
            background: var(--user-gradient);
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
            transition: 0.2s;
        }

        .new-chat-btn:active { transform: scale(0.95); }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-list::-webkit-scrollbar { width: 3px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--cyber-cyan); border-radius: 10px; }

        .history-item {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-size: 13px;
            color: #cbd5e1;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .history-item:hover, .history-item.active {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--cyber-cyan);
            color: #fff;
        }

        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 110;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* Header Layout */
        .chat-header {
            padding: 10px 14px;
            background: rgba(5, 3, 20, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .saara-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-pink));
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, var(--cyber-cyan), var(--cyber-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .action-btns {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--cyber-cyan);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .header-btn:active { transform: scale(0.92); }

        /* Messages Area */
        .messages-box {
            flex: 1;
            padding: 16px 14px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .messages-box::-webkit-scrollbar { width: 4px; }
        .messages-box::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, var(--cyber-cyan), var(--cyber-pink)); 
            border-radius: 10px; 
        }

        .msg-row {
            display: flex;
            width: 100%;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { justify-content: flex-end; }
        .msg-row.bot { justify-content: flex-start; }

        .msg-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .user .msg-bubble {
            background: var(--user-gradient);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.2);
        }

        .bot .msg-bubble {
            background: var(--bot-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.08);
        }

        /* Google Gemini Live Fullscreen Style Overlay */
        #live-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 0, 15, 0.96);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 130;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .live-orb-container {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .live-pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00f3ff, #ff007f, #8a2be2, #00f3ff);
            opacity: 0.35;
            filter: blur(12px);
            animation: geminiPulse 3s infinite linear;
        }

        .live-pulse-ring:nth-child(2) {
            animation: geminiPulseReverse 4s infinite linear;
            opacity: 0.25;
        }

        @keyframes geminiPulse {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); opacity: 0.5; }
            100% { transform: scale(1) rotate(360deg); }
        }

        @keyframes geminiPulseReverse {
            0% { transform: scale(1.1) rotate(360deg); }
            50% { transform: scale(0.95) rotate(180deg); opacity: 0.4; }
            100% { transform: scale(1.1) rotate(0deg); }
        }

        .live-core-btn {
            position: relative;
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #00f3ff, #7928ca, #ff0080);
            border-radius: 50%;
            border: none;
            color: #fff;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.6);
            z-index: 10;
        }

        #screen-preview {
            width: 90%;
            max-width: 260px;
            height: 140px;
            border-radius: 12px;
            border: 2px solid var(--cyber-cyan);
            object-fit: cover;
            margin-bottom: 15px;
            display: none;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .waveform-bars {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 35px;
            margin: 12px 0;
        }

        .waveform-bars span {
            width: 5px;
            height: 10px;
            background: var(--cyber-cyan);
            border-radius: 3px;
            animation: waveBounce 1.2s infinite ease-in-out;
        }

        .waveform-bars span:nth-child(2) { animation-delay: 0.1s; background: var(--cyber-pink); }
        .waveform-bars span:nth-child(3) { animation-delay: 0.2s; background: var(--cyber-purple); height: 25px; }
        .waveform-bars span:nth-child(4) { animation-delay: 0.3s; background: var(--cyber-cyan); height: 35px; }
        .waveform-bars span:nth-child(5) { animation-delay: 0.4s; background: var(--cyber-pink); }

        @keyframes waveBounce {
            0%, 100% { height: 10px; opacity: 0.4; }
            50% { height: 45px; opacity: 1; }
        }

        .live-status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: var(--cyber-cyan);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .live-transcript {
            font-size: 14px;
            color: #cbd5e1;
            max-width: 450px;
            min-height: 40px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .live-controls-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .live-action-btn {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--cyber-cyan);
            color: var(--cyber-cyan);
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-action-btn.active {
            background: var(--cyber-cyan);
            color: #030014;
        }

        .close-live-btn {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-live-btn:hover { background: #ff0055; color: #fff; }

        /* Input Area */
        .input-area {
            padding: 12px 14px;
            background: rgba(5, 3, 20, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(18, 14, 41, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 18px;
            padding: 6px 8px 6px 14px;
            gap: 6px;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            resize: none;
            max-height: 90px;
            height: 24px;
            line-height: 24px;
            padding: 0;
            display: block;
        }

        textarea::placeholder { color: #64748b; }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .mic-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.3); color: var(--cyber-cyan); }
        .send-btn { background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-purple)); color: #030014; }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Chat History Sidebar Panel -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="history-sidebar" id="history-sidebar">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> Chat History</h3>
            <button class="new-chat-btn" id="new-chat-btn"><i class="fa-solid fa-plus"></i> New Chat</button>
        </div>
        <div class="history-list" id="history-list-box"></div>
    </div>

    <!-- Gemini Live Fullscreen Style Overlay with Screencast & Vision Capture -->
    <div id="live-overlay">
        <video id="screen-preview" autoplay playsinline muted></video>
        
        <div class="live-orb-container">
            <div class="live-pulse-ring"></div>
            <div class="live-pulse-ring"></div>
            <button class="live-core-btn" id="live-core-icon"><i class="fa-solid fa-microphone"></i></button>
        </div>
        <div class="live-status-text" id="live-status-label">Saara is listening...</div>
        
        <div class="waveform-bars" id="waveform-visual">
            <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="live-transcript" id="live-transcript-box">Aap boliye sir, main sun rahi hoon...</div>
        
        <div class="live-controls-row">
            <button class="live-action-btn" id="screen-share-btn"><i class="fa-solid fa-desktop"></i> Screen Share</button>
            <button class="close-live-btn" id="close-live-btn">Exit Live</button>
        </div>
    </div>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="brand-box">
                <button class="header-btn" id="history-toggle-btn" title="Chat History" style="border-color: var(--cyber-cyan);">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <div class="saara-avatar"><i class="fa-solid fa-atom"></i></div>
                <div class="brand-text"><h2>Saara AI</h2></div>
            </div>
            <div class="action-btns">
                <button class="header-btn" id="live-toggle-btn" title="Launch Saara Live & Screencast" style="background: rgba(255,0,127,0.2); border-color: var(--cyber-pink); color: var(--cyber-pink);">
                    <i class="fa-solid fa-podcast"></i>
                </button>
                <button class="header-btn" id="clear-btn" title="Clear Chat"><i class="fa-solid fa-trash-can"></i></button>
                <button class="header-btn" id="speech-btn" title="Toggle Speech"><i class="fa-solid fa-volume-high"></i></button>
            </div>
        </div>

        <!-- Chat Box -->
        <div class="messages-box" id="chat-box">
            <div class="msg-row bot">
                <div class="msg-bubble">Namaste Sir! Live mode launch karke screen share button dabayein!</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Saara se kuch bhi..." rows="1"></textarea>
                <button class="icon-btn mic-btn" id="mic-btn"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn send-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

      <!-- JavaScript with Instant Fast Chat, Chat History, Vision & Browser Female TTS Support -->
    <script>
        let speechEnabled = true;
        let isLiveActive = false;
        let currentAudio = null;
        let recognition = null;
        let isListening = false;
        let screenStream = null;

        // Chat History State
        let chats = JSON.parse(localStorage.getItem('saara_chats')) || [];
        let currentChatId = localStorage.getItem('saara_current_chat_id') || null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('speech-btn').addEventListener('click', toggleSpeech);
            document.getElementById('live-toggle-btn').addEventListener('click', toggleSaaraLive);
            document.getElementById('clear-btn').addEventListener('click', clearChat);
            document.getElementById('close-live-btn').addEventListener('click', toggleSaaraLive);
            document.getElementById('mic-btn').addEventListener('click', toggleSaaraLive);
            document.getElementById('send-btn').addEventListener('click', sendMessage);
            document.getElementById('screen-share-btn').addEventListener('click', toggleScreenShare);

            // History Sidebar Controls
            document.getElementById('history-toggle-btn').addEventListener('click', toggleSidebar);
            document.getElementById('sidebar-overlay').addEventListener('click', toggleSidebar);
            document.getElementById('new-chat-btn').addEventListener('click', startNewChat);

            document.getElementById('user-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });

            loadChatHistoryList();
            if (currentChatId) {
                loadChatMessages(currentChatId);
            } else {
                startNewChat();
            }

            // Load browser voices for TTS
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
            }
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('history-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function startNewChat() {
            currentChatId = 'chat_' + Date.now();
            localStorage.setItem('saara_current_chat_id', currentChatId);
            
            const newChatObj = {
                id: currentChatId,
                title: 'New Conversation',
                messages: [{ sender: 'bot', text: 'Namaste Sir! Nayi chat shuru ho chuki hai. Bataiye kya madad karun?' }]
            };

            chats.unshift(newChatObj);
            saveChatsToStorage();
            renderChatBox();
            loadChatHistoryList();
            toggleSidebar();
        }

        function saveChatsToStorage() {
            localStorage.setItem('saara_chats', JSON.stringify(chats));
        }

        function loadChatHistoryList() {
            const listBox = document.getElementById('history-list-box');
            listBox.innerHTML = '';

            if (chats.length === 0) {
                listBox.innerHTML = '<div style="color: #64748b; font-size: 13px; text-align: center; margin-top: 20px;">Koi history nahi hai</div>';
                return;
            }

            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerText = chat.title;
                item.onclick = () => switchChat(chat.id);
                listBox.appendChild(item);
            });
        }

        function switchChat(chatId) {
            currentChatId = chatId;
            localStorage.setItem('saara_current_chat_id', currentChatId);
            loadChatMessages(chatId);
            loadChatHistoryList();
            toggleSidebar();
        }

        function loadChatMessages(chatId) {
            const chatObj = chats.find(c => c.id === chatId);
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';

            if (!chatObj || !chatObj.messages) {
                chatBox.innerHTML = `<div class="msg-row bot"><div class="msg-bubble">Namaste Sir!</div></div>`;
                return;
            }

            chatObj.messages.forEach(msg => {
                const row = document.createElement('div');
                row.className = `msg-row ${msg.sender}`;
                row.innerHTML = `<div class="msg-bubble">${msg.sender === 'bot' ? marked.parse(msg.text) : msg.text}</div>`;
                chatBox.appendChild(row);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderChatBox() {
            loadChatMessages(currentChatId);
        }

        function addMessageToCurrentChat(sender, text) {
            let chatObj = chats.find(c => c.id === currentChatId);
            if (!chatObj) {
                startNewChat();
                chatObj = chats.find(c => c.id === currentChatId);
            }

            if (sender === 'user' && chatObj.title === 'New Conversation') {
                chatObj.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
            }

            chatObj.messages.push({ sender, text });
            saveChatsToStorage();
            loadChatHistoryList();
        }

        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            const btn = document.getElementById('speech-btn');
            if (speechEnabled) {
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                btn.style.color = '#00f3ff';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                btn.style.color = '#64748b';
                if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            }
        }

        // Friendly Browser TTS for normal chat (Filters out emojis, code and markdown symbols)
        function speakFriendlyText(text) {
            if (!speechEnabled || !('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();

            const cleanText = text
                .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
                .replace(/[*#_`~\[\]()>-]/g, ' ')
                .replace(/```[\s\S]*?```/g, 'code block skip kiya gaya hai')
                .trim();

            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'hi-IN';
            utterance.rate = 1.0;
            utterance.pitch = 1.1;

            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => 
                (v.lang.includes('hi') || v.lang.includes('en')) && 
                (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Kalpana') || v.name.includes('Swara') || v.name.includes('Zira') || v.name.includes('Heera'))
            );
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function toggleSaaraLive() {
            isLiveActive = !isLiveActive;
            const overlay = document.getElementById('live-overlay');
            
            if (isLiveActive) {
                if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
                overlay.style.display = 'flex';
                startLiveListening();
            } else {
                overlay.style.display = 'none';
                if (recognition && isListening) { recognition.stop(); }
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                stopScreenShare();
            }
        }

        async function toggleScreenShare() {
    const preview = document.getElementById('screen-preview'); 
    const shareBtn = document.getElementById('screen-share-btn');

    // 1. Agar Native Android App mein hain toh Native Bridge trigger karein
    if (window.AndroidBridge && window.AndroidBridge.requestScreenCapture) {
        window.AndroidBridge.requestScreenCapture();
        
        // Jab native system pop-up mein user "Start now" click karega
        window.onScreenCaptureGranted = function() {
            console.log("Native screen capture granted!");
            if (shareBtn) {
                shareBtn.classList.add('active');
            }
            // Yahan aap apna streaming/canvas logic dal sakte hain
        };
        return;
    }

    // 2. Fallback: Agar standard Web Browser / PWA mein hain
    if (!screenStream) {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            if (preview) {
                preview.srcObject = screenStream;
                preview.style.display = 'block';
                try { await preview.play(); } catch (e) {}
            }
            if (shareBtn) {
                shareBtn.classList.add('active');
            }
        } catch (err) {
            console.log("Screen share error:", err);
        }
    } else {
        stopScreenShare();
    }
}


        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
            }
            const preview = document.getElementById('screen-preview');
            const shareBtn = document.getElementById('screen-share-btn');
            if (preview) preview.style.display = 'none';
            if (shareBtn) {
                shareBtn.classList.remove('active');
                shareBtn.innerHTML = '<i class="fa-solid fa-desktop"></i> Screen Share';
            }
        }

        function captureScreenSnapshot() {
            const video = document.getElementById('screen-preview');
            if (!screenStream || video.readyState < 2) return null;
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 360;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.7);
        }

        function updateLiveUI(status, text, iconClass, showWave) {
            document.getElementById('live-status-label').innerText = status;
            document.getElementById('live-transcript-box').innerText = text;
            document.getElementById('live-core-icon').innerHTML = `<i class="${iconClass}"></i>`;
            document.getElementById('waveform-visual').style.display = showWave ? 'flex' : 'none';
        }

        function startLiveListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Browser voice recognition support nahi karta!");
                return;
            }

            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN';
                recognition.interimResults = false;
                recognition.continuous = false;

                recognition.onstart = () => {
                    isListening = true;
                    updateLiveUI("Saara is listening...", "Aap boliye sir, main sun rahi hoon...", "fa-solid fa-microphone", true);
                };

                recognition.onresult = (event) => {
                    let transcript = event.results[0][0].transcript;
                    transcript = transcript.replace(/\b(सारा|सॉरा|सराह|sara|saraa|shara)\b/gi, 'Saara');
                    
                    updateLiveUI("Processing...", `Sir: "${transcript}"`, "fa-solid fa-spinner fa-spin", false);
                    sendLiveMessage(transcript);
                };

                recognition.onerror = () => {
                    isListening = false;
                    if (isLiveActive) {
                        setTimeout(() => { if (isLiveActive) startLiveListening(); }, 1000);
                    }
                };

                recognition.onend = () => { isListening = false; };
                recognition.start();
            } catch (e) {
                isListening = false;
            }
        }

        // Live mode uses server backend audio (Sarvam/Deepgram/Google)
        async function sendLiveMessage(message) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="msg-row user"><div class="msg-bubble">${message}</div></div>`;
            addMessageToCurrentChat('user', message);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            const botMsgId = 'bot-' + Date.now();
            chatBox.innerHTML += `<div class="msg-row bot" id="${botMsgId}"><div class="msg-bubble">...</div></div>`;

            // Yahan is_live: true bhej rahe hain taaki server TTS generate kare
            const payload = { message: message, is_live: true };
            const screenImage = captureScreenSnapshot();
            if (screenImage) { payload.image = screenImage; }

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                document.getElementById(botMsgId).querySelector('.msg-bubble').innerHTML = marked.parse(data.reply);
                addMessageToCurrentChat('bot', data.reply);

                if (speechEnabled && data.audio) {
                    updateLiveUI("Saara is speaking...", data.reply, "fa-solid fa-volume-high", true);
                    
                    currentAudio = new Audio(`data:${data.mimeType || 'audio/wav'};base64,${data.audio}`);
                    currentAudio.play();

                    currentAudio.onended = () => {
                        if (isLiveActive) { startLiveListening(); };
                    };
                } else {
                    if (isLiveActive) startLiveListening();
                }
            } catch (err) {
                updateLiveUI("Connection Error", "Network issue ho gaya sir.", "fa-solid fa-triangle-exclamation", false);
                if (isLiveActive) setTimeout(() => startLiveListening(), 2000);
            }
        }

        // Normal chat is SUPER FAST and uses browser friendly TTS (Server TTS is skipped)
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = inputField.value.trim();
            if (!message) return;

            chatBox.innerHTML += `<div class="msg-row user"><div class="msg-bubble">${message}</div></div>`;
            addMessageToCurrentChat('user', message);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const botMsgId = 'bot-' + Date.now();
            chatBox.innerHTML += `<div class="msg-row bot" id="${botMsgId}"><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Yahan is_live: false bhej rahe hain taaki server TTS skip ho jaye aur chat super-fast ho
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, is_live: false })
                });
                const data = await response.json();
                
                document.getElementById(botMsgId).querySelector('.msg-bubble').innerHTML = marked.parse(data.reply);
                addMessageToCurrentChat('bot', data.reply);
                
                // Speak using client-side friendly TTS
                if (speechEnabled) {
                    speakFriendlyText(data.reply);
                }
            } catch (error) {
                document.getElementById(botMsgId).querySelector('.msg-bubble').innerText = "Server Connection Error!";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            let chatObj = chats.find(c => c.id === currentChatId);
            if (chatObj) {
                chatObj.messages = [{ sender: 'bot', text: 'Namaste Sir! Chat clear kar di gayi hai.' }];
                saveChatsToStorage();
                loadChatMessages(currentChatId);
            }
            if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        }
    </script>
