<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saara Live AI</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --cyber-pink: #ff007f;
            --cyber-cyan: #00f3ff;
            --cyber-purple: #8a2be2;
            --bg-void: #030014;
            --glass-card: rgba(13, 10, 31, 0.85);
            --glass-border: rgba(0, 243, 255, 0.2);
            --user-gradient: linear-gradient(135deg, #7928ca, #ff0080);
            --bot-bg: rgba(18, 14, 41, 0.85);
            --text-main: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            z-index: 0;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--cyber-pink); top: -40px; left: -40px; }
        .orb-2 { width: 350px; height: 350px; background: var(--cyber-purple); bottom: -60px; right: -60px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(25px) scale(1.05); }
        }

        .chat-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            height: 94vh;
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15);
            overflow: hidden;
        }

        /* Header Layout */
        .chat-header {
            padding: 10px 14px;
            background: rgba(5, 3, 20, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .saara-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-pink));
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, var(--cyber-cyan), var(--cyber-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .action-btns {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--cyber-cyan);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .header-btn:active {
            transform: scale(0.92);
        }

        /* Messages Area */
        .messages-box {
            flex: 1;
            padding: 16px 14px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .messages-box::-webkit-scrollbar { width: 4px; }
        .messages-box::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, var(--cyber-cyan), var(--cyber-pink)); 
            border-radius: 10px; 
        }

        .msg-row {
            display: flex;
            width: 100%;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { justify-content: flex-end; }
        .msg-row.bot { justify-content: flex-start; }

        .msg-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .user .msg-bubble {
            background: var(--user-gradient);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.2);
        }

        .bot .msg-bubble {
            background: var(--bot-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.08);
        }

        /* Gemini Live Fullscreen Style Overlay */
        #live-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 0, 20, 0.95);
            backdrop-filter: blur(25px);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .live-orb-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .live-pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-pink));
            opacity: 0.4;
            animation: pulseRing 2s infinite ease-out;
        }

        .live-pulse-ring:nth-child(2) {
            animation-delay: 1s;
        }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .live-core-btn {
            position: relative;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-purple));
            border-radius: 50%;
            border: none;
            color: #fff;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px var(--cyber-cyan);
            z-index: 10;
        }

        .waveform-bars {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 40px;
            margin: 20px 0;
        }

        .waveform-bars span {
            width: 5px;
            height: 10px;
            background: var(--cyber-cyan);
            border-radius: 3px;
            animation: waveBounce 1.2s infinite ease-in-out;
        }

        .waveform-bars span:nth-child(2) { animation-delay: 0.1s; background: var(--cyber-pink); }
        .waveform-bars span:nth-child(3) { animation-delay: 0.2s; background: var(--cyber-purple); height: 25px; }
        .waveform-bars span:nth-child(4) { animation-delay: 0.3s; background: var(--cyber-cyan); height: 35px; }
        .waveform-bars span:nth-child(5) { animation-delay: 0.4s; background: var(--cyber-pink); }

        @keyframes waveBounce {
            0%, 100% { height: 10px; opacity: 0.4; }
            50% { height: 45px; opacity: 1; }
        }

        .live-status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--cyber-cyan);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .live-transcript {
            font-size: 15px;
            color: #cbd5e1;
            max-width: 500px;
            min-height: 50px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .close-live-btn {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-live-btn:hover {
            background: #ff0055;
            color: #fff;
        }

        /* Input Area */
        .input-area {
            padding: 12px 14px;
            background: rgba(5, 3, 20, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(18, 14, 41, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 18px;
            padding: 6px 8px 6px 14px;
            gap: 6px;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            resize: none;
            max-height: 90px;
            height: 24px;
            line-height: 24px;
            padding: 0;
            display: block;
        }

        textarea::placeholder { color: #64748b; }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .mic-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--cyber-cyan);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-purple));
            color: #030014;
        }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Gemini Live Fullscreen Style Overlay -->
    <div id="live-overlay">
        <div class="live-orb-container">
            <div class="live-pulse-ring"></div>
            <div class="live-pulse-ring"></div>
            <button class="live-core-btn" id="live-core-icon"><i class="fa-solid fa-microphone"></i></button>
        </div>
        <div class="live-status-text" id="live-status-label">Saara is listening...</div>
        
        <div class="waveform-bars" id="waveform-visual">
            <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="live-transcript" id="live-transcript-box">Aap boliye sir, main sun rahi hoon...</div>
        <button class="close-live-btn" id="close-live-btn">Exit Live Mode</button>
    </div>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="brand-box">
                <div class="saara-avatar"><i class="fa-solid fa-atom"></i></div>
                <div class="brand-text">
                    <h2>Saara AI</h2>
                </div>
            </div>
            <div class="action-btns">
                <!-- Gemini Live Launch Button -->
                <button class="header-btn" id="live-toggle-btn" title="Launch Gemini Live Mode" style="background: rgba(255,0,127,0.2); border-color: var(--cyber-pink); color: var(--cyber-pink);">
                    <i class="fa-solid fa-podcast"></i>
                </button>
                <button class="header-btn" id="clear-btn" title="Clear Chat">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <button class="header-btn" id="speech-btn" title="Toggle Speech">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>

        <!-- Chat Box -->
        <div class="messages-box" id="chat-box">
            <div class="msg-row bot">
                <div class="msg-bubble">Namaste Sir! Upar diye gaye podcast/live button par click karke aap **Gemini Live Mode** shuru kar sakte hain!</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Saara se kuch bhi..." rows="1"></textarea>
                <button class="icon-btn mic-btn" id="mic-btn"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn send-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- JavaScript with safe Event Listeners -->
    <script>
        let speechEnabled = true;
        let isLiveActive = false;
        let currentAudio = null;
        let recognition = null;
        let isListening = false;

        document.addEventListener('DOMContentLoaded', () => {
            // Button Event Bindings
            document.getElementById('speech-btn').addEventListener('click', toggleSpeech);
            document.getElementById('live-toggle-btn').addEventListener('click', toggleSaaraLive);
            document.getElementById('clear-btn').addEventListener('click', clearChat);
            document.getElementById('close-live-btn').addEventListener('click', toggleSaaraLive);
            document.getElementById('mic-btn').addEventListener('click', toggleSaaraLive);
            document.getElementById('send-btn').addEventListener('click', sendMessage);

            document.getElementById('user-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { 
                    e.preventDefault(); 
                    sendMessage(); 
                }
            });
        });

        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            const btn = document.getElementById('speech-btn');
            if (speechEnabled) {
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                btn.style.color = '#00f3ff';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                btn.style.color = '#64748b';
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            }
        }

        function toggleSaaraLive() {
            isLiveActive = !isLiveActive;
            const overlay = document.getElementById('live-overlay');
            
            if (isLiveActive) {
                overlay.style.display = 'flex';
                startLiveListening();
            } else {
                overlay.style.display = 'none';
                if (recognition && isListening) { recognition.stop(); }
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            }
        }

        function updateLiveUI(status, text, iconClass, showWave) {
            document.getElementById('live-status-label').innerText = status;
            document.getElementById('live-transcript-box').innerText = text;
            document.getElementById('live-core-icon').innerHTML = `<i class="${iconClass}"></i>`;
            document.getElementById('waveform-visual').style.display = showWave ? 'flex' : 'none';
        }

        function startLiveListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Browser voice recognition support nahi karta!");
                return;
            }

            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN';
                recognition.interimResults = false;
                recognition.continuous = false;

                recognition.onstart = () => {
                    isListening = true;
                    updateLiveUI("Saara is listening...", "Aap boliye sir, main sun rahi hoon...", "fa-solid fa-microphone", true);
                };

                recognition.onresult = (event) => {
                    let transcript = event.results[0][0].transcript;
                    transcript = transcript.replace(/\b(सारा|सॉरा|सराह|sara|saraa|shara)\b/gi, 'Saara');
                    
                    updateLiveUI("Processing...", `Sir: "${transcript}"`, "fa-solid fa-spinner fa-spin", false);
                    sendLiveMessage(transcript);
                };

                recognition.onerror = () => {
                    isListening = false;
                    if (isLiveActive) {
                        setTimeout(() => { if (isLiveActive) startLiveListening(); }, 1000);
                    }
                };

                recognition.onend = () => { isListening = false; };
                recognition.start();
            } catch (e) {
                isListening = false;
            }
        }

        async function sendLiveMessage(message) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="msg-row user"><div class="msg-bubble">${message}</div></div>`;
            
            const botMsgId = 'bot-' + Date.now();
            chatBox.innerHTML += `<div class="msg-row bot" id="${botMsgId}"><div class="msg-bubble">...</div></div>`;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                document.getElementById(botMsgId).querySelector('.msg-bubble').innerHTML = marked.parse(data.reply);

                if (speechEnabled && data.audio) {
                    updateLiveUI("Saara is speaking...", data.reply, "fa-solid fa-volume-high", true);
                    
                    currentAudio = new Audio(`data:${data.mimeType || 'audio/wav'};base64,${data.audio}`);
                    currentAudio.play();

                    currentAudio.onended = () => {
                        if (isLiveActive) {
                            startLiveLis
