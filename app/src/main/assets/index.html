<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saara AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="avatar">S</div>
            <div class="info">
                <h1>Saara AI</h1>
                <span class="status">System Native Assistant</span>
            </div>
        </div>
    </header>
    
    <main id="chat-container">
        <div class="message saara">
            <p>Namaste! Main Saara hoon. Aapki native AI assistant. Bataiye, kya karna hai?</p>
        </div>
    </main>

    <footer class="input-area">
        <input type="text" id="user-input" placeholder="Message Saara..." autocomplete="off">
        <button id="send-btn">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
