name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create dummy webDir
        run: |
          mkdir -p www
          echo "<html><body>Loading...</body></html>" > www/index.html

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform and Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Add Required Permissions and Service to Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />' $MANIFEST
          
          # Inject ScreenCastService into Manifest inside application tag
          sed -i 's/<application/\<application\>\n        <service android:name=".ScreenCastService" android:foregroundServiceType="mediaProjection" android:exported="false" \/>/' $MANIFEST

      - name: Setup Native ScreenCastService and MainActivity Bridge
        run: |
          # 1. Create ScreenCastService.java for True Native Background Casting
          SERVICE_FILE="android/app/src/main/java/com/saara/ai/ScreenCastService.java"
          mkdir -p android/app/src/main/java/com/saara/ai/
          cat << 'EOF' > $SERVICE_FILE
          package com.saara.ai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;

          public class ScreenCastService extends Service {
              private static final String CHANNEL_ID = "SaaraScreenCastChannel";

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Saara AI is active")
                          .setContentText("Screen casting and audio stream are live...")
                          .setSmallIcon(android.R.drawable.ic_menu_camera)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .build();

                  startForeground(1337, notification);
                  return START_NOT_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel serviceChannel = new NotificationChannel(
                              CHANNEL_ID,
                              "Saara Screen Cast Service Channel",
                              NotificationManager.IMPORTANCE_HIGH
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(serviceChannel);
                      }
                  }
              }
          }
          EOF

          # 2. Update MainActivity.java with Native Bridges and Back Gesture Fix
          MAIN_ACTIVITY="android/app/src/main/java/com/saara/ai/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            cat << 'EOF' > $MAIN_ACTIVITY
          package com.saara.ai;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final int REQUEST_CODE_SCREEN_CAPTURE = 1000;
              private static final int REQUEST_RECORD_AUDIO_PERMISSION = 200;
              private MediaProjectionManager projectionManager;
              public static int screenCaptureResultCode = 0;
              public static Intent screenCaptureIntent = null;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, REQUEST_RECORD_AUDIO_PERMISSION);
                  }

                  projectionManager = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      request.grant(request.getResources());
                                  }
                              });
                          }
                      });

                      this.bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void requestScreenCapture() {
                              if (projectionManager != null) {
                                  Intent intent = projectionManager.createScreenCaptureIntent();
                                  startActivityForResult(intent, REQUEST_CODE_SCREEN_CAPTURE);
                              }
                          }
                      }, "AndroidBridge");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (this.bridge != null && this.bridge.getWebView() != null && this.bridge.getWebView().canGoBack()) {
                      this.bridge.getWebView().goBack();
                  } else {
                      moveTaskToBack(true);
                  }
              }

              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQUEST_CODE_SCREEN_CAPTURE) {
                      if (resultCode == RESULT_OK && data != null) {
                          screenCaptureResultCode = resultCode;
                          screenCaptureIntent = data;

                          // Start Native Foreground Service to maintain live casting state
                          Intent serviceIntent = new Intent(this, ScreenCastService.class);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent);
                          } else {
                              startService(serviceIntent);
                          }

                          if (this.bridge != null && this.bridge.getWebView() != null) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      bridge.getWebView().evaluateJavascript("if(window.onScreenCaptureGranted) window.onScreenCaptureGranted();", null);
                                  }
                              });
                          }
                      }
                  }
              }
          }
          EOF
          fi

      - name: Fix Kotlin Version Conflict
        run: |
          echo "
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  }
              }
          }" >> android/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saara-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
